<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>grain settings</title>
<style>
  :root {
    --bg: #0a0a0b; --raise: #141416; --edge: #212125;
    --ink: #f4f4f5; --dim: #8b8b93; --faint: #5a5a62; --accent: #ff5f38;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 34px 30px; max-width: 480px; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.005em;
    -webkit-font-smoothing: antialiased; }
  h1 { margin: 0 0 26px; font-size: 16px; font-weight: 600; letter-spacing: -.03em; }
  h1 b { color: var(--accent); }
  label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
  input { width: 100%; font-family: var(--mono); font-size: 13px; padding: 11px 13px; color: var(--ink);
    background: var(--raise); border: 1px solid var(--edge); border-radius: 10px; outline: none;
    transition: border-color .18s ease; }
  input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  button { font: inherit; font-size: 12.5px; font-weight: 500; padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent); color: #180701; cursor: pointer;
    transition: opacity .18s ease; }
  button:hover { opacity: .88; }
  #status { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
  p.note { color: var(--faint); font-size: 12.5px; margin-top: 22px; }
  code { font-family: var(--mono); font-size: 11.5px; color: var(--dim); background: var(--raise);
    border: 1px solid var(--edge); border-radius: 5px; padding: 2px 6px; }
</style>
</head>
<body>
  <h1>grain<b>.</b></h1>
  <label for="server">Where grain is running</label>
  <input id="server" type="text" placeholder="http://localhost:4610" spellcheck="false">
  <div class="row"><button id="save">Save</button><span id="status"></span></div>
  <p class="note">Start it with <code>bun run serve</code> in the grain repo. Point this at a Tailscale hostname if the library lives on another machine.</p>
  <script src="options.js"></script>
</body>
</html>
